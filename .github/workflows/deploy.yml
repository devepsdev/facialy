name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend · dependencias y modelos
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python download_models.py

      - name: Backend · tests
        working-directory: backend
        run: python manage.py test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend · lint y build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Desplegar en el VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner self-hosted del VPS (etiqueta "vps"); el de la Orange Pi no la tiene
    runs-on: [self-hosted, vps]

    concurrency:
      group: deploy
      cancel-in-progress: false

    env:
      APP_DIR: /opt/apps/facialy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # El .env (secretos, BASE_PATH vacío para servir en la raíz de facialy.deveps.dev)
      # vive solo en el servidor: no se sobrescribe ni se borra.
      - name: Sync code to ${{ env.APP_DIR }}
        run: |
          test -f "$APP_DIR/.env" || { echo "Falta $APP_DIR/.env en el servidor"; exit 1; }
          rsync -a --delete --exclude='.git' --exclude='.env' --exclude='.env.local' ./ "$APP_DIR"/

      - name: Build and deploy
        working-directory: ${{ env.APP_DIR }}
        run: docker compose up -d --build

      - name: Wait for healthy service
        working-directory: ${{ env.APP_DIR }}
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' facialy_web 2>/dev/null || echo starting)
            echo "facialy_web: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker compose logs --tail 80 web
          exit 1

      - name: Prune old images
        run: docker image prune -f
