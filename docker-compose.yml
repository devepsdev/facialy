services:
  db:
    image: postgres:16-alpine
    container_name: facialy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    container_name: facialy_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # En producción se usa .env (generado por el workflow); en local, `ENV_FILE=.env.local`
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
